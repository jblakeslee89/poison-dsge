project:
  type: website
  output-dir: _site

website:
  title: "Adversarial Nowcasting"
  description: "How a state adversary could distort the Federal Reserve's real-time read of the economy."
  reader-mode: false
  page-navigation: false
  navbar:
    background: light
    pinned: false
    left:
      - text: "The story"
        href: index.qmd
      - text: "Methodology"
        href: methodology.qmd
      - text: "Try it yourself"
        href: explore.qmd
    right:
      - icon: github
        href: https://github.com/jblakeslee89/poison-dsge
        aria-label: GitHub repository

format:
  closeread-html:
    theme:
      - cosmo
      - styles.scss
    css: styles.css
    cr-section:
      layout: "sidebar-left"
    cr-style:
      narrative-background-color-overlay: "rgba(255, 255, 255, 0.92)"
      narrative-text-color-overlay: "#1a1a1a"
      section-background-color: "#fafaf7"
      narrative-font-family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      narrative-font-size: "1.05rem"
    toc: false
    embed-resources: false
    page-layout: full
    fontsize: "16px"
    grid:
      sidebar-width: 0px
      body-width: 1200px
      margin-width: 0px

execute:
  freeze: auto
  echo: false
  warning: false

jupyter:
  kernelspec:
    name: python3
    display_name: Python 3
    language: python
