project:
  type: website
  output-dir: _site
  resources:
    - "assets/**"

website:
  title: "Adversarial Nowcasting"
  description: "How a state adversary could distort the Federal Reserve's real-time read of the economy."
  reader-mode: false
  page-navigation: false
  navbar:
    background: light
    pinned: false
    left:
      - text: "The story"
        href: index.qmd
      - text: "Methodology"
        href: methodology.qmd
      - text: "Try it yourself"
        href: explore.qmd
    right:
      - icon: github
        href: https://github.com/jblakeslee89/poison-dsge
        aria-label: GitHub repository

format:
  html:
    theme:
      - cosmo
      - styles.scss
    css: styles.css
    toc: false
    embed-resources: false
    page-layout: full
    fontsize: "16px"
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://cdn.plot.ly">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    include-after-body:
      - assets/scrolly.html

execute:
  freeze: auto
  echo: false
  warning: false

jupyter:
  kernelspec:
    name: python3
    display_name: Python 3
    language: python
